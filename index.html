<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางรหัสสีประตูบริษัท - Company Door Color Palette</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3">
    <span id="toast-message">คัดลอกรหัสสีแล้ว!</span>
  </div>

  <!-- Loading Overlay -->
  <div id="loading" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent mb-3"></div>
    <p class="text-slate-600 font-medium text-sm">กำลังโหลดข้อมูลสีจาก Google Sheets...</p>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b pb-6 border-slate-200">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">🚪 คลังรหัสสีประตูบริษัท</h1>
        <p class="text-sm text-slate-500 mt-1">ข้อมูลเชื่อมต่อกับ Google Sheets ส่วนกลาง อัปเดตแบบเรียลไทม์</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchColors()" class="px-3.5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs md:text-sm font-medium rounded-lg transition-colors">
          🔄รีเฟรชข้อมูล
        </button>
        <button onclick="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-medium rounded-lg shadow-sm transition-colors">
          + เพิ่มสีใหม่
        </button>
      </div>
    </header>

    <div class="mb-6">
      <input type="text" id="searchInput" oninput="renderTable()" placeholder="🔍 ค้นหาชื่อสี หรือรหัส HEX..." class="w-full md:w-80 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm text-sm">
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100/70 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
              <th class="py-4 px-6">ตัวอย่างสี</th>
              <th class="py-4 px-6">ชื่อเรียกสี</th>
              <th class="py-4 px-6">HEX Code</th>
              <th class="py-4 px-6">RGB Code</th>
              <th class="py-4 px-6">CMYK Code</th>
              <th class="py-4 px-6 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="colorTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="colorModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h2 id="modalTitle" class="text-xl font-bold text-slate-900 mb-4">เพิ่มข้อมูลสีใหม่</h2>
      <form id="colorForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="colorId">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ชื่อเรียกสี *</label>
          <input type="text" id="colorName" required placeholder="เช่น เทาชาร์โคล" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">เลือกสี / รหัส HEX *</label>
          <div class="flex gap-2">
            <input type="color" id="colorPicker" onchange="syncColorFromPicker()" class="w-10 h-10 rounded border border-slate-300 cursor-pointer p-0.5">
            <input type="text" id="colorHex" required oninput="syncPickerFromHex()" placeholder="#FFFFFF" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">RGB Code</label>
          <input type="text" id="colorRgb" placeholder="RGB(255, 255, 255)" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">CMYK Code</label>
          <input type="text" id="colorCmyk" placeholder="CMYK(0, 0, 0, 0)" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono">
        </div>
        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ วาง URL ของ Google Apps Script ที่ได้จากขั้นตอนที่ 3 ไว้ตรงนี้
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwS3OK2BO0k-eo8vm3I6M8pAE3LX3UAE9s5J_hB4hf3qA-5OBx7UlZ-pnIVfZhnsQJl/exec";

    let colors = [];

    async function fetchColors() {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const response = await fetch(`${SCRIPT_URL}?action=get`);
        colors = await response.json();
        renderTable();
      } catch (err) {
        alert('ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function renderTable() {
      const tbody = document.getElementById('colorTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      const filtered = colors.filter(c => (c.name && c.name.toLowerCase().includes(search)) || (c.hex && c.hex.toLowerCase().includes(search)));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">ไม่พบข้อมูลสี</td></tr>`;
        return;
      }

      filtered.forEach(c => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="py-4 px-6"><div class="w-12 h-12 rounded-xl shadow-inner border border-slate-200" style="background-color: ${c.hex}"></div></td>
          <td class="py-4 px-6 font-semibold text-slate-800">${c.name}</td>
          <td class="py-4 px-6"><button onclick="copyToClipboard('${c.hex}')" class="font-mono text-xs font-medium bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 px-2.5 py-1.5 rounded-lg border border-slate-200 transition-colors">${c.hex} 📋</button></td>
          <td class="py-4 px-6"><button onclick="copyToClipboard('${c.rgb}')" class="font-mono text-xs text-slate-600 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 px-2.5 py-1.5 rounded-lg border border-slate-200 transition-colors">${c.rgb || '-'} 📋</button></td>
          <td class="py-4 px-6"><button onclick="copyToClipboard('${c.cmyk}')" class="font-mono text-xs text-slate-600 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 px-2.5 py-1.5 rounded-lg border border-slate-200 transition-colors">${c.cmyk || '-'} 📋</button></td>
          <td class="py-4 px-6 text-center">
            <div class="flex justify-center gap-2">
              <button onclick="openModal('${c.id}')" class="text-slate-400 hover:text-indigo-600 p-1">✏️</button>
              <button onclick="deleteColor('${c.id}')" class="text-slate-400 hover:text-red-600 p-1">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('colorId').value || String(Date.now());
      const name = document.getElementById('colorName').value.trim();
      const hex = document.getElementById('colorHex').value.trim().toUpperCase();
      const rgb = document.getElementById('colorRgb').value.trim();
      const cmyk = document.getElementById('colorCmyk').value.trim();

      const colorData = { id, name, hex, rgb, cmyk };
      const action = document.getElementById('colorId').value ? 'edit' : 'add';

      document.getElementById('loading').classList.remove('hidden');
      closeModal();

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, color: colorData })
        });
        showToast('บันทึกข้อมูลเรียบร้อย (กำลังซิงค์ข้อมูล...)');
        setTimeout(fetchColors, 1500); // รอให้ Sheet บันทึกแล้วโหลดใหม่
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึก');
        document.getElementById('loading').classList.add('hidden');
      }
    }

    async function deleteColor(id) {
      if (!confirm('คุณต้องการลบรายการสีนี้ใช่หรือไม่?')) return;

      document.getElementById('loading').classList.remove('hidden');
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id })
        });
        showToast('ลบรายการสำเร็จ (กำลังซิงค์ข้อมูล...)');
        setTimeout(fetchColors, 1500);
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการลบ');
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function copyToClipboard(text) {
      if (!text || text === '-') return;
      navigator.clipboard.writeText(text).then(() => showToast(`คัดลอก "${text}" เรียบร้อยแล้ว`));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    function openModal(id = null) {
      document.getElementById('colorForm').reset();
      document.getElementById('colorId').value = '';
      document.getElementById('modalTitle').innerText = id ? 'แก้ไขข้อมูลสี' : 'เพิ่มข้อมูลสีใหม่';

      if (id) {
        const color = colors.find(c => String(c.id) === String(id));
        if (color) {
          document.getElementById('colorId').value = color.id;
          document.getElementById('colorName').value = color.name;
          document.getElementById('colorHex').value = color.hex;
          document.getElementById('colorPicker').value = color.hex;
          document.getElementById('colorRgb').value = color.rgb;
          document.getElementById('colorCmyk').value = color.cmyk;
        }
      }
      document.getElementById('colorModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('colorModal').classList.add('hidden'); }
    function syncColorFromPicker() { document.getElementById('colorHex').value = document.getElementById('colorPicker').value.toUpperCase(); }
    function syncPickerFromHex() {
      const hex = document.getElementById('colorHex').value;
      if (/^#[0-9A-F]{6}$/i.test(hex)) document.getElementById('colorPicker').value = hex;
    }

    window.onload = fetchColors;
  </script>
</body>
</html>
